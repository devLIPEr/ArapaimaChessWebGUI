<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArapaimaChess</title>
    <link rel="stylesheet" href="./css/style.css">
    <link rel="shortcut icon" href="./assets/icon.ico" type="image/x-icon">
    <link rel="stylesheet"
      href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css"
      integrity="sha384-q94+BZtLrkL1/ohfjR8c6L+A6qzNH9R2hBLwyoAfu3i/WCvQjzL2RQJ3uNHDISdU"
      crossorigin="anonymous">
</head>
<body>
    <header>
        <div id="header_logo">
            <img src="./assets/icon.png" alt="ArapaimaChess icon">
            <h2>ArapaimaChess</h2>
        </div>
    </header>
    <main>
        <div id="engine_out">
        </div>
        <div id="board">
            <div id="board1"></div>
        </div>
        <div id="opt">
            <div id="move_sequence">
            </div>
            <input type="text" name="fen" id="fen">
            <div id="player_color">
                <button onclick="setOrientation('white', true)">
                    <img draggable="false" id="white_player" class="color_img" src="./img/chesspieces/wikipedia/wK.png" alt="White">
                </button>
                <button onclick="setOrientation(undefined, true)">
                    <div draggable="false" class="mix_container">
                        <img draggable="false" class="color_img clipped_img img_crop_left" src="./img/chesspieces/wikipedia/wK.png" alt="White">
                        <img draggable="false" class="color_img clipped_img img_crop_right" src="./img/chesspieces/wikipedia/bK.png" alt="Black">
                    </div>
                </button>
                <button onclick="setOrientation('black', true)">
                    <img draggable="false" class="color_img" src="./img/chesspieces/wikipedia/bK.png" alt="Black">
                </button>
            </div>
            <div id="player_options">
                <button onclick="undoMove()">
                    <img draggable="false" src="./img/back.png" alt="Undo move">
                </button>
                <button onclick="resign()">
                    <img draggable="false" src="./img/flag.png" alt="Undo move">
                </button>
                <button onclick="setOrientation((boardPerspective == 1) ? 'black' : 'white'); boardPerspective ^= 1;">
                    <img draggable="false" src="./img/reload.png" alt="Undo move">
                </button>
            </div>
        </div>
    </main>
    <div id="promotion_popup">
        <div id="promo_q" class="piece_promo square-55d63 white-1e1d7">
            <img src="img/chesspieces/wikipedia/wQ.png" alt="" class="piece_promo" style="width:84px;height:84px;">
        </div>
        <div id="promo_r" class="piece_promo square-55d63 black-3c85d">
            <img src="img/chesspieces/wikipedia/wR.png" alt="" class="piece_promo" style="width:84px;height:84px;">
        </div>
        <div id="promo_b" class="piece_promo square-55d63 white-1e1d7">
            <img src="img/chesspieces/wikipedia/wB.png" alt="" class="piece_promo" style="width:84px;height:84px;">
        </div>
        <div id="promo_n" class="piece_promo square-55d63 black-3c85d">
            <img src="img/chesspieces/wikipedia/wN.png" alt="" class="piece_promo" style="width:84px;height:84px;">
        </div>
    </div>
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"
        integrity="sha384-ZvpUoO/+PpLXR1lu4jmpXWu80pZlYUAfxl5NsBMWOEPSjUn/6Z/hRTt8+pR6L4N2"
        crossorigin="anonymous"></script>

    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"
        integrity="sha384-8Vi8VHwn3vjQ9eUHUxex3JSN/NFqUg3QbPyX8kWyb93+8AC/pPWTzj+nHtbC5bxD"
        crossorigin="anonymous"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.2/chess.js"
        integrity="sha384-s3XgLpvmHyscVpijnseAmye819Ee3yaGa8NxstkJVyA6nuDFjt59u1QvuEl/mecz"
        crossorigin="anonymous"></script>

    <script src="./js/index.js"></script>

    <script src="./engine/arapaima.js"></script>
</body>
</html>
